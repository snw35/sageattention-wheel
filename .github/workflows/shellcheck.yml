name: Shellcheck

on:
  push:
    branches: [ "master", "main", "mainline" ]
  pull_request:
    branches: [ "master", "main", "mainline" ]
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          shellcheck --severity=warning cu12/*.sh cu13/*.sh
